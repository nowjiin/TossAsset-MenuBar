name: Release

on:
  # main 에 푸시하면 검증·빌드를 거쳐 릴리스까지 자동으로 간다.
  # 올릴 버전은 커밋 메시지에서 뽑는다 (Conventional Commits).
  push:
    branches: [main]
  # 커밋 메시지와 무관하게 특정 버전을 올리고 싶을 때의 탈출구.
  workflow_dispatch:
    inputs:
      release_type:
        description: Initial release or semantic version bump
        required: true
        default: patch
        type: choice
        options:
          - initial
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    # macOS 15 runner는 arm64이며, 앱의 deployment target(macOS 14+)과는 별개다.
    runs-on: macos-15

    steps:
      - name: Checkout the release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: source

      - name: Determine release version
        id: version
        working-directory: source
        env:
          MANUAL_RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch --force --tags origin

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            bump="$MANUAL_RELEASE_TYPE"
          else
            # 커밋 메시지에서 올릴 단위를 뽑는다.
            #
            # 메시지는 신뢰할 수 없는 입력이므로 셸에 끼워 넣지 않고 jq 로만 다룬다.
            # `${{ }}` 로 보간하면 메시지에 담긴 문자가 그대로 명령이 된다.
            #
            # 이번 푸시에 여러 커밋이 있으면 **가장 큰 단위**를 따른다. feat 과 fix 가
            # 섞여 있는데 patch 만 올리면 새 기능이 패치로 나가 버린다.
            bump="$(jq -r '
              [ .commits[]?.message
                | split("\n")[0]
                | if test("^[a-z]+(\\([^)]*\\))?!:") then "major"
                  elif test("^feat(\\([^)]*\\))?:")  then "minor"
                  elif test("^(fix|perf|revert)(\\([^)]*\\))?:") then "patch"
                  else "none" end
              ]
              + [ .commits[]?.message
                  | if test("BREAKING CHANGE") then "major" else "none" end
                ]
              | if index("major") then "major"
                elif index("minor") then "minor"
                elif index("patch") then "patch"
                else "none" end
            ' "$GITHUB_EVENT_PATH")"
            echo "커밋 메시지에서 판단한 단위: $bump"
          fi

          if [[ "$bump" == "none" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "올릴 버전이 없어 릴리스를 만들지 않습니다 (docs·ci·chore 등)."
            echo "검증과 빌드는 아래 스텝에서 계속 진행합니다."
            exit 0
          fi

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | sed -n '1p')"

          if [[ -n "$latest_tag" ]] && git merge-base --is-ancestor "$RELEASE_SHA" "$latest_tag"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_SHA 커밋은 이미 $latest_tag 릴리스에 포함돼 있습니다."
            exit 0
          fi

          if [[ -z "$latest_tag" ]]; then
            next_version="0.1.0"
          else
            if [[ "$bump" == "initial" ]]; then
              echo "initial은 태그가 하나도 없을 때만 사용할 수 있습니다."
              exit 1
            fi

            current="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "$current"
            case "$bump" in
              major) next_version="$((major + 1)).0.0" ;;
              minor) next_version="$major.$((minor + 1)).0" ;;
              patch) next_version="$major.$minor.$((patch + 1))" ;;
              *) echo "지원하지 않는 release type: $bump"; exit 1 ;;
            esac
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "릴리스 버전: v$next_version"

      # 아래 검증·빌드 스텝은 **릴리스 여부와 무관하게 항상 돌린다.**
      # 이 워크플로가 이 저장소의 유일한 CI 다. `docs:` 커밋이라 릴리스를 만들지 않는
      # 경우에도 빌드가 깨졌는지는 알아야 한다 — 접두어는 사람이 붙이는 것이고,
      # `docs:` 라고 쓰면서 Swift 코드를 고치는 일이 실제로 생긴다.
      - name: Verify Apple Silicon runner
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "Apple Silicon runner가 아닙니다: $(uname -m)"
            exit 1
          fi

      # 러너 툴체인은 로컬보다 낮을 수 있고,
      # 그 차이 때문에 로컬만 통과하는 일이 음 (동시성 검사 규칙이 버전마다 다르다).
      # 실패 로그만 보고 원인을 좁힐 수 있도록 버전을 남긴다.
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run checks
        working-directory: source
        run: swift run TossAssetMenuBarCheck

      # 번들 조립과 ad-hoc 서명까지 항상 확인한다. 배포 경로가 깨지는 것도
      # 컴파일 오류와 마찬가지로 푸시 시점에 알아야 한다.
      - name: Build and sign the app bundle
        working-directory: source
        run: ./Scripts/build-app.sh

      # 여기서부터가 릴리스다. 위 검증·빌드가 전부 통과한 뒤에만 실행된다.
      - name: Package for release
        if: steps.version.outputs.should_release == 'true'
        working-directory: source
        run: ./Scripts/package-release.sh --version "${{ steps.version.outputs.version }}"

      - name: Verify release artifacts
        if: steps.version.outputs.should_release == 'true'
        working-directory: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="dist/v$VERSION/TossAsset-MenuBar.zip"
          (
            cd "dist/v$VERSION"
            shasum -a 256 -c "TossAsset-MenuBar.zip.sha256"
          )
          mkdir -p "$RUNNER_TEMP/release-verification"
          ditto -x -k "$archive" "$RUNNER_TEMP/release-verification"
          app="$RUNNER_TEMP/release-verification/TossAsset-MenuBar.app"
          codesign --verify --deep --strict "$app"
          [[ "$(lipo -archs "$app/Contents/MacOS/TossAsset-MenuBar")" == "arm64" ]]

      - name: Create GitHub tag and Release
        if: steps.version.outputs.should_release == 'true'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.version.outputs.release_sha }}
        run: |
          args=(
            "v$VERSION"
            "dist/v$VERSION/TossAsset-MenuBar.zip"
            "dist/v$VERSION/TossAsset-MenuBar.zip.sha256"
            --target "$RELEASE_SHA"
            --title "TossAsset-MenuBar v$VERSION"
          )

          # 노트 파일은 버전별로 둔다. 단일 파일로 두면 버전을 올렸을 때 갱신을 잊고
          # 이전 버전의 노트가 그대로 붙는다 — 자동 생성보다 나쁜 결과다.
          # 파일이 없으면 커밋·PR 목록으로 자동 생성한다.
          notes_file=".github/release-notes/v$VERSION.md"
          if [[ -f "$notes_file" ]]; then
            echo "릴리스 노트: $notes_file"
            args+=(--notes-file "$notes_file")
          else
            echo "릴리스 노트: 자동 생성 ($notes_file 없음)"
            args+=(--generate-notes)
          fi

          gh release create "${args[@]}"
