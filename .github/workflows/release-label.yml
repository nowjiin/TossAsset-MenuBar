name: Release label

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one release label
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          count="$(jq '[.[].name | select(
            . == "release:major" or
            . == "release:minor" or
            . == "release:patch" or
            . == "release:none"
          )] | length' <<<"$LABELS_JSON")"

          if [[ "$count" -ne 1 ]]; then
            echo "PR에는 release:major, release:minor, release:patch, release:none 중 하나만 필요합니다."
            exit 1
          fi
